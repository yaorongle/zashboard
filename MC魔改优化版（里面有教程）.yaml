# ============================= - fake-ip 的规则 - ============================

#Fake IP
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  listen: :23453
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: rule
  respect-rules: false
  prefer-h3: false
  fake-ip-filter:
    - RULE-SET,cn,real-ip
    - RULE-SET,private,real-ip
    - RULE-SET,geolocation-!cn,fake-ip
    - MATCH,fake-ip
  default-nameserver:
    - 223.5.5.5
    - 182.254.116.116
    - 202.96.128.86    
  nameserver:
    - tls://dns.alidns.com:853
    - tls://dot.pub:853
  proxy-nameserver:
    - tls://one.one.one.one:853
    - tls://dns.google:853


#==============================复制粘贴而已，也不能删除===================================

#===================复制上面DNS这个区域去MC插件里面的fake-ip的地方粘贴======================

#====DNS粘贴好后，记得选择勾选fake-ip，然后高级设置下面选择：Redir TCP & Tproxy UDP 或者 Tproxy TCP & UDP，可以勾选V6或者不要

#============ 然后选择好后在订阅管理第一行上传这个yaml订阅，上传好后上面配置文件选择这个上传的启动 ==================

port: 7890
proxies:

# ================================================ - 机场配置模块 - ===========================================
provider_config:                                         
  &provider_config { "type": "http", "interval": 86400, "proxy": "DIRECT", "health-check": { "enable": true, "url": "http://www.apple.com/library/test/success.html", "interval": 300, "timeout": 5000, "lazy": true }, "filter": "^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))" }

# ================================================ - 订阅位置 - ==============================================
proxy-providers:
# 第一个机场
  vip:
    url: http://############################### #修改你的机场1订阅地址（有些anytls节点的需要后面加：&flag=anytls）
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场1的UA
    override:
      additional-prefix: "[vip]"
      udp: true #如果不能用就改：false

# 第二个机场
  vip2:
    url: http://############################### #修改你的机场2订阅地址
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场2的UA
    override:
      additional-prefix: "[vip2]"
      udp: true #如果不能用就改：false

# 第三个机场
  vip3:
    url: http://############################### #修改你的机场3订阅地址
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场3的UA
    override:
      additional-prefix: "[vip3]"
      udp: true #如果不能用就改：false



# ============================================= - ⚓️ 锚点区开始 - =============================================
# 锚点 -  代理优先
prefer_proxy: &prefer_proxy { "type": "select", "proxies": [ "默认代理", "节点选择", "自动选择", "手动选择", "香港", "美国", "日本", "台湾", "新加坡", "韩国", "其他地区", "DIRECT" ] }

# 锚点 -  直连优先
prefer_direct: &prefer_direct { "type": "select", "proxies": [ "DIRECT", "节点选择", "自动选择", "手动选择", "香港", "美国", "日本", "台湾", "新加坡", "韩国", "其他地区" ] }

# 锚点 -  自动选择
url_test: &url_test { "type": "url-test", "interval": 120, "tolerance": 30, "lazy": true, "url": "https://www.apple.com/library/test/success.html", "disable-udp": false, "timeout": 3000, "max-failed-times": 3, "hidden": false, "include-all": true }
# ============================================= - ⚓️ 锚点区结束 - ==============================================

# =============================================  -  域名策略组  - ===============================================
proxy-groups:
  # 主要分组策略
  - { name: 默认代理,    type: select,          include-all: true, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png }
  - { name: 手动选择,    type: select,          include-all: true, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png }
  - { name: 节点选择,    type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png, proxies: [ 自动选择, 手动选择, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 其他地区, DIRECT ] }
  - { name: 自动选择,    <<: *url_test,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SSID_1.png }
  - { name: 漏网之鱼,    type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png, proxies: [ 默认代理,节点选择, DIRECT ] }

  # AI 相关服务
  - { name: AI,         type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Siri.png, proxies: [ 美国, 日本, 新加坡, 韩国, 香港, 台湾, 其他地区, 默认代理, 手动选择 ] }
  - { name: Gemini,     type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png, proxies: [ 美国, 日本, 新加坡, 韩国, 香港, 台湾, 其他地区, 默认代理, 手动选择 ] }
  - { name: ChatGPT,    type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png, proxies: [ 美国, 日本, 新加坡, 韩国, 台湾, 其他地区, 默认代理, 手动选择 ] }

  # 常用软件/网站
  - { name: Apple,      <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png }
  - { name: Bilibili,   <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png }
  - { name: Google,     <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png }
  - { name: YouTube,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png }
  - { name: GitHub,     <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png }
  - { name: Microsoft,  <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png }
  - { name: Telegram,   <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png }
  - { name: Twitter,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png }
  - { name: Instagram,  <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Instagram.png }
  - { name: Facebook,   <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Facebook.png }
  - { name: Cloudflare, <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cloudflare.png }

  # 音视频
  - { name: Spotify,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png }
  - { name: Netflix,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png }
  - { name: TikTok,     <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png, proxies: [ 美国, 日本, 新加坡, 韩国, 台湾, 其他地区, 手动选择 ] }
  - { name: 香港银行,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/yaorongle/zashboard/main/logo/hk-banks.png, proxies: [ 香港 ] } 
  - { name: Emby,       <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png} 
  - { name: Disney,     <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney.png} 
   # 测速服务
  - { name: Speedtest,  <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png }
   # 游戏服务
  - { name: Xbox,       <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Xbox.png }
  - { name: Steam,      <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Steam.png}
  - { name: Nintendo,   <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Nintendo.png}
  - { name: PlayStation,<<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PlayStation_1.png}
  # 兜底
  - { name: 国外网站,    <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_Nations.png }
  - { name: 国内网站,    type: select,          icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png, proxies: [ DIRECT, 节点选择 ] }


# =============================================  -  节点分组策略  - ================================================
  # 国家/地区过滤
  - { name: 香港,        <<: *url_test, filter: '^(?=.*((?i)🇭🇰|香港|港|(\b(HK|Hong|HKG|🇭🇰)\b)))(?!.*(排除1|排除2|5x)).*$',                                     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png }
  - { name: 台湾,        <<: *url_test, filter: '^(?=.*((?i)🇨🇳|台湾|(\b(🇹🇼|TW|Taiwan|ROC|🇹🇼)\b)))(?!.*(排除1|排除2|5x)).*$',                                   icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png }
  - { name: 新加坡,      <<: *url_test, filter: '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore|SIN|🇸🇬)\b)))(?!.*(排除1|排除2|5x)).*$',                               icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SG.png }
  - { name: 日本,        <<: *url_test, filter: '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan|NRT|HND|🇯🇵)\b)))(?!.*(排除1|排除2|5x)).*$',             icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/JP.png }
  - { name: 韩国,        <<: *url_test, filter: '^(?=.*((?i)🇰🇷|韩国|首尔|(\b(KR|Korea|SEL|🇰🇷)\b)))(?!.*(排除1|排除2|5x)).*$',                                   icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/KR.png }
  - { name: 美国,        <<: *url_test, filter: '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States|LAX|🇺🇸)\b)))(?!.*(排除1|排除2|5x)).*$', icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png }
  # 其它地区，想隐藏其他地区可以把hidden: true
  - { name: 其他地区,    type: select, include-all: true, hidden: false, filter: "^(?!.*(DIRECT|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|🇭🇰|香港|HK|Hong|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|JP|Japan|🇨🇳|台湾|🇹🇼|TW|🇸🇬|新加坡|狮|SG|Singapore|🇰🇷|韩国|首尔|KR|Korea)).*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png }


