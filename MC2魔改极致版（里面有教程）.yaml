  - { name: 日本均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan|NRT|HND|🇯🇵)\b)))(?!.*(排除1|排除2|5x)).*$',         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/JP.png }
  - { name: 韩国均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇰🇷|韩国|首尔|(\b(KR|Korea|SEL|🇰🇷)\b)))(?!.*(排除1|排除2|5x)).*$',                               icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/KR.png }
  - { name: 德国均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇩🇪|德国|德|(\b(DE|GER|Germany|DEU|🇩🇪)\b)))(?!.*(排除1|排除2|5x)).*$',                           icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/DE.png }
  - { name: 法国均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇫🇷|法国|法|(\b(FR|FRA|France|🇫🇷)\b)))(?!.*(排除1|排除2|5x)).*$',                                 icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/FR.png }
  - { name: 英国均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇬🇧|英国|英|(\b(UK|GB|GBR|United Kingdom|🇬🇧)\b)))(?!.*(排除1|排除2|5x)).*$',                      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/UK.png }
  - { name: 美国均衡,        <<: *LoadBalanceCH,hidden: true, include-all: true, filter: '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States|LAX|🇺🇸)\b)))(?!.*(排除1|排除2|5x)).*$', icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png }

  # 故障转移-散列
  - { name: 香港策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇭🇰|香港|港|(\b(HK|Hong|HKG|🇭🇰)\b)))(?!.*(排除1|排除2|5x)).*$',                                 icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HK.png }
  - { name: 台湾策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇨🇳|台湾|(\b(🇹🇼|TW|Taiwan|ROC|🇹🇼)\b)))(?!.*(排除1|排除2|5x)).*$',                               icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TW.png }
  - { name: 新加坡策略,      <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore|SIN|🇸🇬)\b)))(?!.*(排除1|排除2|5x)).*$',                           icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SG.png }
  - { name: 日本策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan|NRT|HND|🇯🇵)\b)))(?!.*(排除1|排除2|5x)).*$',         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/JP.png }
  - { name: 韩国策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇰🇷|韩国|首尔|(\b(KR|Korea|SEL|🇰🇷)\b)))(?!.*(排除1|排除2|5x)).*$',                               icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/KR.png }
  - { name: 德国策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇩🇪|德国|德|(\b(DE|GER|Germany|DEU|🇩🇪)\b)))(?!.*(排除1|排除2|5x)).*$',                           icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/DE.png }
  - { name: 法国策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇫🇷|法国|法|(\b(FR|FRA|France|🇫🇷)\b)))(?!.*(排除1|排除2|5x)).*$',                                 icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/FR.png }
  - { name: 英国策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇬🇧|英国|英|(\b(UK|GB|GBR|United Kingdom|🇬🇧)\b)))(?!.*(排除1|排除2|5x)).*$',                      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/UK.png }
  - { name: 美国策略,        <<: *FallBack,hidden: true, include-all: true, filter: '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States|LAX|🇺🇸)\b)))(?!.*(排除1|排除2|5x)).*$', icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png }  



