  # 国内
  - { name: Apple,                  <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png }
  - { name: Bilibili,               <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png }
  - { name: Microsoft,              <<: *prefer_direct,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png }

  # 游戏服务
  - { name: Xbox,                   <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Xbox.png }
