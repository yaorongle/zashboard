# =========================================================================
#              Magic Catling2 优化配置配合1.2.1+ 姥舅                       #
#                                                 -- Mihomo v1.19.27+     #
#                看下面有教程的字，哪些复制哪些粘贴                          #
#                                                                         #
#  总就四步：复制DNS粘贴，填写订阅地址在下面，上传这份yaml，选择这份yaml启动    #
# =========================================================================

# ============================= - fake-ip 的规则 - ============================
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  listen: :23453
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  respect-rules: false
  prefer-h3: false
  fake-ip-filter:
   - RULE-SET,private,real-ip
   - RULE-SET,category-pt,real-ip      
   - RULE-SET,apple@cn,real-ip
   - RULE-SET,cn,real-ip     
   - RULE-SET,cloudflare@cn,real-ip
   - RULE-SET,microsoft@cn,real-ip    
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 180.76.76.76
  direct-nameserver:
    - https://doh.pub/dns-query#disable-qtype-65=true  
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
  nameserver:
    - https://doh.pub/dns-query#disable-qtype-65=true  
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
       

#==============================复制粘贴而已，也不能删除===================================

#===================复制上面DNS这个区域去MC插件里面的fake-ip的地方粘贴======================

#====DNS粘贴好后，记得选择勾选fake-ip，然后高级设置下面选择：Redir TCP & Tproxy UDP 或者 Tproxy TCP & UDP，可以勾选V6或者不要

#============ 然后选择好后在订阅管理第一行上传这个yaml订阅，上传好后上面配置文件选择这个上传的启动 ==================


port: 7890
proxies:


# ================================================ - 机场配置模块 - ===========================================

# 锚点 -  代理提供者模板 - 订阅源基础配置
provider_config: &provider_config { "type": "http", "interval": 86400, "proxy": "DIRECT", "health-check": { "enable": true, "url": "https://www.google.com/generate_204", "interval": 300, "lazy": true } }

# ================================================ - 订阅位置 - ==============================================
proxy-providers:
# 第一个机场
  vip1:
    url: http://############################### #修改你的机场1订阅地址（有些anytls节点的需要后面加：&flag=anytls）
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[国务院]"
      udp: true #如果不能用就改：false

# 第二个机场
  vip2:
    url: http://############################### #修改你的机场1订阅地址
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[检察院]"
      udp: true #如果不能用就改：false


# 第三个机场
  vip3:
    url: http://############################### #修改你的机场1订阅地址
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[督查院]"
      udp: true #如果不能用就改：false

    

# ============================================= - ⚓️ 锚点区开始 - =============================================
# 锚点 -  自动选择
url_test: &url_test { type: url-test, interval: 300, tolerance: 100, lazy: true, url: "http://cp.cloudflare.com/generate_204", disable-udp: false, timeout: 3000, max-failed-times: 3, hidden: false, include-all: true }

# 锚点 - 负载均衡测速策略模块
LoadBalanceCH: &LoadBalanceCH {type: load-balance, interval: 300, lazy: true, url: 'http://cp.cloudflare.com/generate_204', disable-udp: false, strategy: consistent-hashing, timeout: 2000, max-failed-times: 3, hidden: false}

# 锚点 - 故障转移测速策略模块
FallBack: &FallBack {type: fallback, interval: 300, lazy: true, url: 'http://cp.cloudflare.com/generate_204', disable-udp: false, timeout: 2000, max-failed-times: 4, hidden: false }


# 锚点 -  策略组代理列表模板 - 预定义的代理节点优先级排序
# 锚点 -  直连优先
prefer_direct: &prefer_direct { "type": "select", "proxies": [ DIRECT, 默认代理, 手动选择, 指定节点 ] }
# 锚点 -  默认代理优先
prefer_moren: &prefer_moren { "type": "select", "proxies": [  手动选择, 指定节点, 自动选择, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 德国, 法国, 英国, 荒郊地区, DIRECT ] }
# 锚点 -  代理优先
prefer_proxy: &prefer_proxy { "type": "select", "proxies": [  默认代理, 负载均衡, 故障转移, 自动选择, 手动选择, 指定节点, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 德国, 法国, 英国, 荒郊地区, DIRECT ] }
# 锚点 -  AI
prefer_AI: &prefer_AI { "type": "select", "proxies": [ 默认代理, 智能故转, 负载均衡, 自动选择, 手动选择, 指定节点, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 德国, 法国, 英国, 荒郊地区, DIRECT ] }



# ============================================= - ⚓️ 锚点区结束 - =============================================

# =============================================  -  域名策略组  - ===============================================
proxy-groups:
  # 主要分组策略
  - { name: 手动选择,                type: select,          include-all: true, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png }
  - { name: 指定节点,                type: select,          include-all: true, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png }    
  - { name: 默认代理,                <<: *prefer_moren,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png }
  # AI故转分组策略
  - { name: 智能故转,                <<: *FallBack,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ULB.png, proxies: [美国策略, 日本策略, 新加坡策略] }   
  - { name: 故障转移,                <<: *FallBack,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png, proxies: [新加坡策略, 香港策略, 台湾策略, 日本策略, 韩国策略, 德国策略, 法国策略, 英国策略, 美国策略 ] }  
  - { name: 负载均衡,                <<: *LoadBalanceCH,    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png, proxies: [ 香港均衡, 日本均衡, 台湾均衡, 新加坡均衡, 韩国均衡, 德国均衡, 法国均衡, 英国均衡, 美国均衡] }
  - { name: 自动选择,                <<: *url_test,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SSID_1.png }

  # 漏网之鱼策略  
  - { name: 漏网之鱼,                <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png }
  
  # AI 相关服务
  - { name: AI,                     <<: *prefer_AI,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Siri.png }
  - { name: Gemini,                 <<: *prefer_AI,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png }
  - { name: ChatGPT,                <<: *prefer_AI,         icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png }

  # 国外
  - { name: GitHub,                 <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png }
  - { name: Cloudflare,             <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cloudflare.png }   
  - { name: Google,                 <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png }
  - { name: YouTube,                <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png }
  - { name: Media国外媒体集合,       <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube_Music.png }

  # 社交平台策略
  - { name: Telegram,               <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png }
  - { name: Whatsapp,               <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/WeChat.png }
  - { name: Twitter,                <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png }
  - { name: Instagram,              <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Instagram.png }
  - { name: Facebook,               <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Facebook.png }
  - { name: Social国外社交集合,      <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png }

  # 音视频
  - { name: Spotify,                <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png }
  - { name: Netflix,                <<: *prefer_proxy,     icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png }
