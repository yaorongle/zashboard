  - { name: 美国,            <<: *url_test, filter: '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States|LAX|🇺🇸)\b)))(?!.*(排除1|排除2|5x)).*$', icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/US.png }
  # 其它地区，想隐藏其他地区可以把hidden: true
  - { name: 荒郊地区,       type: select, include-all: true, hidden: false, filter: "^(?!.*(DIRECT|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|🇭🇰|香港|HK|Hong|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|JP|Japan|🇨🇳|台湾|🇹🇼|TW|🇸🇬|新加坡|狮|SG|Singapore|🇰🇷|韩国|首尔|KR|Korea)).*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png }

  # 负载均衡-散列
